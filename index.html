<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime & AI Chat App</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=currentUser" alt="User Avatar" id="user-avatar">
                    <h3>Chats</h3>
                </div>
                <div class="sidebar-actions">
                    <button title="Add Character" id="add-char-btn"><i class="fa-solid fa-plus"></i></button>
                    <button title="Settings" id="settings-btn"><i class="fa-solid fa-gear"></i></button>
                </div>
            </div>

            <!-- Search Contacts -->
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-contacts" placeholder="Search or start new chat">
            </div>

            <!-- Contacts List -->
            <div class="contacts-list" id="contacts-list">
                <!-- Dynamically rendered via app.js -->
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <!-- Welcome View (When no chat is active) -->
            <div class="chat-welcome" id="chat-welcome">
                <div class="welcome-content">
                    <i class="fa-solid fa-comments"></i>
                    <h2>Anime & AI Messenger</h2>
                    <p>Select a contact or create a custom character to start chatting and roleplaying.</p>
                </div>
            </div>

            <!-- Active Chat Box -->
            <div class="chat-box hidden" id="chat-box">
                <!-- Chat Header -->
                <div class="chat-header">
                    <div class="chat-header-user">
                        <button class="back-btn" id="back-btn"><i class="fa-solid fa-arrow-left"></i></button>
                        <img src="" alt="Avatar" id="active-avatar">
                        <div class="chat-header-info">
                            <h3 id="active-name">Character Name</h3>
                            <span id="active-status">Online</span>
                        </div>
                    </div>
                    <div class="chat-actions">
                        <button title="Roleplay Mode" id="roleplay-toggle-btn"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
                    </div>
                </div>

                <!-- Messages Container -->
                <div class="messages-container" id="messages-container">
                    <!-- Dynamically rendered via chat.js -->
                </div>

                <!-- Chat Input Footer -->
                <div class="chat-input-footer">
                    <input type="text" id="message-input" placeholder="Type a message...">
                    <button id="send-btn" title="Send Message"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </main>
    </div>

    <!-- API Settings Modal -->
    <div id="api-settings-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>AI Settings</h3>
                <button id="close-api-modal" class="close-btn">&times;</button>
            </div>
            <form id="api-settings-form">
                <div class="form-group">
                    <label for="ai-provider">AI Provider</label>
                    <select id="ai-provider">
                        <option value="openrouter">OpenRouter</option>
                        <option value="openai">OpenAI</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="api-key-input">API Key</label>
                    <input type="password" id="api-key-input" placeholder="Enter your API Key...">
                </div>
                <div class="form-group">
                    <label for="ai-model-input">AI Model</label>
                    <input type="text" id="ai-model-input" placeholder="e.g., openai/gpt-4o-mini">
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-primary">Save AI Settings</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add Custom Character Modal -->
    <div id="add-char-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create Custom Character</h3>
                <button id="close-add-btn" class="close-btn">&times;</button>
            </div>
            <form id="add-char-form">
                <div class="form-group">
                    <label for="new-char-name">Character Name</label>
                    <input type="text" id="new-char-name" placeholder="e.g., Sebastian" required>
                </div>
                <div class="form-group">
                    <label for="new-char-personality">Personality Description</label>
                    <textarea id="new-char-personality" placeholder="Polite, mysterious demon butler..."></textarea>
                </div>
                <div class="form-group">
                    <label for="new-char-prompt">System Prompt / Roleplay Directive</label>
                    <textarea id="new-char-prompt" placeholder="You speak elegantly and end sentences with 'my lord'..."></textarea>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-primary">Create Character</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Roleplay Configuration Modal -->
    <div id="rp-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Roleplay Scenario Config</h3>
                <button id="close-rp-modal" class="close-btn">&times;</button>
            </div>
            <form id="rp-config-form">
                <div class="form-group">
                    <label for="rp-scenario">Scenario / Arc</label>
                    <input type="text" id="rp-scenario" placeholder="e.g., Emerald Witch Arc">
                </div>
                <div class="form-group">
                    <label for="rp-setting">Setting / Location</label>
                    <input type="text" id="rp-setting" placeholder="e.g., Boadicea's Forest">
                </div>
                <div class="form-group">
                    <label for="rp-user-role">Your Role</label>
                    <input type="text" id="rp-user-role" placeholder="e.g., Earl Phantomhive">
                </div>
                <div class="form-group">
                    <label for="rp-char-role">Character Role</label>
                    <input type="text" id="rp-char-role" placeholder="e.g., Head Butler">
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-primary">Start Roleplay</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/characters.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/roleplay.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
