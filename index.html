<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeChat</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/chat.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Contacts Section -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar-container">
                        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=user" alt="User Avatar" id="user-avatar">
                    </div>
                    <span class="username">You</span>
                </div>
                <div class="sidebar-actions">
                    <button title="Settings" id="settings-btn"><i class="fa-solid fa-gear"></i></button>
                </div>
            </div>

            <div class="search-container">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-contacts" placeholder="Search or start new chat">
                </div>
            </div>

            <div class="contacts-list" id="contacts-list">
                <!-- Contacts will be dynamically loaded here -->
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <!-- Default Empty State -->
            <div class="chat-welcome" id="chat-welcome">
                <div class="welcome-content">
                    <i class="fa-solid fa-comments"></i>
                    <h2>AnimeChat</h2>
                    <p>Select a contact to start chatting with your favorite anime characters.</p>
                </div>
            </div>

            <!-- Active Chat Window (Hidden by default until a contact is selected) -->
            <div class="chat-box hidden" id="chat-box">
                <header class="chat-header">
                    <div class="chat-contact-info">
                        <button class="back-btn" id="back-btn"><i class="fa-solid fa-arrow-left"></i></button>
                        <div class="avatar-container">
                            <img src="" alt="Contact Avatar" id="active-avatar">
                            <span class="status-dot" id="active-status-dot"></span>
                        </div>
                        <div class="contact-details">
                            <h3 id="active-name">Character Name</h3>
                            <span id="active-status">Online</span>
                        </div>
                    </div>
                    <div class="chat-actions">
                        <button title="Roleplay Mode" id="roleplay-toggle-btn"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
                        <button title="Contact Info"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                    </div>
                </header>

                <div class="messages-container" id="messages-container">
                    <!-- Messages will be dynamically loaded here -->
                </div>

                <footer class="chat-input-area">
                    <button class="input-action-btn"><i class="fa-solid fa-paperclip"></i></button>
                    <div class="input-wrapper">
                        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                    </div>
                    <button class="send-btn" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
                </footer>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/characters.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
