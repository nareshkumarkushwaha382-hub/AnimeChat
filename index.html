<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AnimeChat</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- Contact List -->
    <section class="contacts" id="contacts">

        <div class="logo">
            AnimeChat
        </div>

        <input 
            id="search"
            class="search"
            type="text"
            placeholder="Search contacts">

        <div id="contactList">

            <div class="contact" data-name="Gojo">
                <div class="avatar">👑</div>
                <div>
                    <h3>Gojo</h3>
                    <p>Online</p>
                </div>
            </div>

            <div class="contact" data-name="Rem">
                <div class="avatar">💙</div>
                <div>
                    <h3>Rem</h3>
                    <p>Online</p>
                </div>
            </div>

            <div class="contact" data-name="Subaru">
                <div class="avatar">⚔️</div>
                <div>
                    <h3>Subaru</h3>
                    <p>Online</p>
                </div>
            </div>

            <div class="contact" data-name="Friend">
                <div class="avatar">👤</div>
                <div>
                    <h3>Friend</h3>
                    <p>Last seen</p>
                </div>
            </div>

        </div>

    </section>


    <!-- Chat Area -->
    <section class="chat" id="chat">

        <header class="chatHeader">

            <button id="back">
                ←
            </button>

            <div class="avatar" id="chatAvatar">
                👑
            </div>

            <div>
                <h2 id="chatName">
                    Gojo
                </h2>

                <p id="chatStatus">
                    Online
                </p>
            </div>

        </header>


        <main id="messages">

            <div class="message bot">
                Welcome to AnimeChat!
            </div>

        </main>


        <footer class="inputBox">

            <input 
                id="messageInput"
                type="text"
                placeholder="Type message">

            <button id="send">
                ➤
            </button>

        </footer>


    </section>

</div>


<script src="script.js"></script>

</body>
</html>
