<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimeChat</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <div class="sidebar">

        <div class="logo">
            AnimeChat
        </div>

        <div class="search">
            <input type="text" placeholder="Search">
        </div>

        <div class="chat-list">

            <div class="chat">
                <div class="avatar">👑</div>

                <div class="info">
                    <div class="name">Gojo</div>
                    <div class="preview">Welcome!</div>
                </div>

                <div class="time">Now</div>
            </div>

            <div class="chat">
                <div class="avatar">💙</div>

                <div class="info">
                    <div class="name">Rem</div>
                    <div class="preview">Hello...</div>
                </div>

                <div class="time">Now</div>
            </div>

            <div class="chat">
                <div class="avatar">⚔️</div>

                <div class="info">
                    <div class="name">Subaru</div>
                    <div class="preview">Let's go.</div>
                </div>

                <div class="time">Now</div>
            </div>

            <div class="chat">
                <div class="avatar">👤</div>

                <div class="info">
                    <div class="name">Rahul</div>
                    <div class="preview">See you tomorrow.</div>
                </div>

                <div class="time">8:20 PM</div>
            </div>

        </div>

    </div>

    <div class="chat-area">

        <div class="header">

            <div class="avatar">
                👑
            </div>

            <div>
                <div class="name">
                    Gojo
                </div>

                <div class="status">
                    Online
                </div>
            </div>

        </div>

        <div class="messages">

            <div class="left">
                <div class="bubble">
                    Welcome to AnimeChat.
                </div>
            </div>

        </div>

        <div class="input">

            <input
            type="text"
            placeholder="Type a message">

            <button>
                ➤
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
    </html>
