<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AnimeChat v1.0</title>

<link rel="stylesheet" href="style.css">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
rel="stylesheet">

</head>

<body>

<div class="app">

<!-- ========================= -->
<!-- LEFT SIDEBAR -->
<!-- ========================= -->

<aside class="sidebar" id="sidebar">

<div class="logo">

<div class="logoIcon">
💬
</div>

<div class="logoText">
AnimeChat
</div>

</div>

<div class="searchBox">

<input
type="text"
id="search"
placeholder="Search characters or friends">

</div>

<div class="menu">

<button class="menuBtn active" id="chatTab">

💬 Chats

</button>

<button class="menuBtn" id="friendsTab">

👤 Friends

</button>

<button class="menuBtn" id="settingsTab">

⚙ Settings

</button>

</div>

<div
class="contactList"
id="contactList">

<!-- GOJO -->

<div
class="contact active"
data-name="Gojo">

<div class="avatar">

👑

</div>

<div class="contactInfo">

<div class="contactTop">

<h3>Gojo</h3>

<span
class="time">

09:20

</span>

</div>

<p
class="lastMessage">

Nice to meet you.

</p>

</div>

</div>

<!-- REM -->

<div
class="contact"
data-name="Rem">

<div class="avatar">

💙

</div>

<div class="contactInfo">

<div class="contactTop">

<h3>Rem</h3>

<span class="time">

09:18

</span>

</div>

<p class="lastMessage">

Rem is here to support you.

</p>

</div>

</div>

<!-- SUBARU -->

<div
class="contact"
data-name="Subaru">

<div class="avatar">

⚔️

</div>

<div class="contactInfo">

<div class="contactTop">

<h3>Subaru</h3>

<span class="time">

Yesterday

</span>

</div>

<p class="lastMessage">

Let's think carefully.

</p>

</div>

</div>

<!-- FRIEND -->

<div
class="contact"
data-name="Friend">

<div class="avatar">

👤

</div>

<div class="contactInfo">

<div class="contactTop">

<h3>Friend</h3>

<span class="time">

Yesterday

</span>

</div>

<p class="lastMessage">

Hey, good to see you.

</p>

</div>

</div>

</div>

<div class="sidebarBottom">

<button id="profileButton">

👤 Profile

</button>

<button id="newChat">

➕

New Chat

</button>

</div>

</aside>

<!-- ========================= -->
<!-- CHAT PAGE -->
<!-- ========================= -->

<section
class="chatContainer"
id="chatContainer">

<header class="chatHeader">

<button
    id="profileButton"
id="backButton">

←

</button>

<div
class="avatar"
id="chatAvatar">

👑

</div>

<div
class="chatUser">

<h2
id="chatName">

Gojo

</h2>

<p
id="chatStatus">

Online

</p>

</div>

<div class="headerActions">

<button
id="voiceCall">

📞

</button>

<button
id="videoCall">

🎥

</button>

<button
id="chatMenu">

⋮

</button>

</div>

</header>

<main
id="messages"
class="messages">

<!-- Messages loaded by JavaScript -->

    </main>

        <!-- Input Area -->

        <footer class="chatInput">

            <button
                id="emojiButton"
                class="inputButton">

                😊

            </button>

            <button
                id="attachButton"
                class="inputButton">

                📎

            </button>

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message...">

            <button
                id="sendButton">

                ➤

            </button>

        </footer>

    </section>

</div>

<!-- ========================= -->
<!-- PROFILE PAGE -->
<!-- ========================= -->

<section
class="page"
id="profilePage">

<header class="pageHeader">

<button class="closePage">

←

</button>

<h2>

Profile

</h2>

</header>

<div class="pageContent">

<div class="profileAvatar">

👤

</div>

<h2 id="profileName">

Your Name

</h2>

<p>

Status:
Available

</p>

<button id="editProfile">

Edit Profile

</button>

</div>

</section>

<!-- ========================= -->
<!-- SETTINGS PAGE -->
<!-- ========================= -->

<section
class="page"
id="settingsPage">

<header class="pageHeader">

<button class="closePage">

←

</button>

<h2>

Settings

</h2>

</header>

<div class="pageContent">

<button class="settingItem">

🌙
Dark Mode

</button>

<button class="settingItem">

🔔
Notifications

</button>

<button class="settingItem">

🔒
Privacy

</button>

<button class="settingItem">

🤖
AI Settings

</button>

<button class="settingItem">

💾
Backup Chats

</button>

</div>

</section>

<!-- ========================= -->
<!-- ADD CONTACT PAGE -->
<!-- ========================= -->

<section
class="page"
id="addContactPage">

<header class="pageHeader">

<button class="closePage">

←

</button>

<h2>

Add Contact

</h2>

</header>

<div class="pageContent">

<input
type="text"
id="newContactName"
placeholder="Contact name">

<input
type="text"
id="newContactAvatar"
placeholder="Emoji (😀)">

<button id="saveContact">

Save Contact

</button>

</div>

</section>

<!-- ========================= -->
<!-- CALL SCREEN -->
<!-- ========================= -->

<section
class="page"
id="callPage">

<div class="callContainer">

<div
class="callAvatar">

👑

</div>

<h2 id="callName">

Gojo

</h2>

<p id="callStatus">

Calling...

</p>

<div class="callButtons">

<button
id="muteCall">

🎤

</button>

<button
id="speakerCall">

🔊

</button>

<button
id="endCall">

📞

</button>

</div>

</div>

</section>

<script src="script.js"></script>

</body>

    </html>
